[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscf-dm-eda"
version = "0.1.0"
description = "Standalone counterpoise density-matrix energy decomposition analysis with PySCF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "pyscf-dm-eda contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26",
    "pyscf>=2.14,<3",
]

[project.optional-dependencies]
dispersion = ["pyscf-dispersion"]
dev = ["pyscf-dispersion"]
test = ["pyscf-dispersion"]

[project.scripts]
pyscf-dm-eda = "pyscf_dm_eda.eda:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyscf_dm_eda = ["py.typed"]
